<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- 這是一個私人的家庭遊記網站。技術上公開，但不希望被搜尋引擎收錄。 -->
  <meta name="robots" content="noindex, nofollow, noarchive, noimageindex">

  <title>美西自駕 2026</title>

  <link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header class="site-header">
    <h1 class="site-title">美西自駕 2026</h1>
    <p class="site-subtitle">6/13 – 6/19 · 1,704 miles</p>
  </header>

  <div id="map"></div>

  <aside id="panel" class="panel">
    <button type="button" class="panel__close" aria-label="關閉">&times;</button>
    <div class="panel__scroll">
      <h2 class="panel__title"></h2>
      <p class="panel__date" hidden></p>
      <p class="panel__description" hidden></p>
      <div class="panel__grid"></div>
    </div>
  </aside>

  <div id="lightbox" class="lightbox">
    <button type="button" class="lightbox__close" aria-label="關閉">&times;</button>
    <button type="button" class="lightbox__nav lightbox__nav--prev" aria-label="上一張">&#8249;</button>
    <img class="lightbox__image" alt="">
    <button type="button" class="lightbox__nav lightbox__nav--next" aria-label="下一張">&#8250;</button>
    <p class="lightbox__counter"></p>
  </div>

  <!-- 資料檔以 <script> 載入而非 fetch()，這樣直接雙擊 index.html 也能運作 -->
  <script src="assets/vendor/leaflet/leaflet.js"></script>
  <script src="data/points.js"></script>
  <script src="data/route.js"></script>
  <script src="data/photos.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
